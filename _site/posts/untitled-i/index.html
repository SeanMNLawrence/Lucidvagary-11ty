  <div class="search-modal-backdrop" id="search-backdrop" style="display: none;"></div>
  <div class="search-modal" id="search-modal" style="display: none;">
    <input type="text" class="search-input" id="search-input" placeholder="Search posts...">
    <div class="search-results" id="search-results"></div>
  </div>

  <script>
    // Hamburger nav toggle (mobile)
    (function () {
      var toggle = document.getElementById("hamburger-toggle");
      var links = document.getElementById("site-nav-links");
      toggle.addEventListener("click", function () {
        links.classList.toggle("open");
        toggle.classList.toggle("open");
      });
    })();

    // Theme toggle
    (function () {
      var toggle = document.getElementById("theme-toggle");
      var icon = document.getElementById("theme-icon");
      function updateIcon() {
        var isLight = document.documentElement.getAttribute("data-theme") === "light";
        icon.innerHTML = isLight ? "&#9788;" : "&#9789;";
      }
      updateIcon();
      toggle.addEventListener("click", function () {
        var isLight = document.documentElement.getAttribute("data-theme") === "light";
        if (isLight) {
          document.documentElement.removeAttribute("data-theme");
          localStorage.setItem("lv-theme", "dark");
        } else {
          document.documentElement.setAttribute("data-theme", "light");
          localStorage.setItem("lv-theme", "light");
        }
        updateIcon();
      });
    })();

    // Simple client-side search
    (function () {
      var toggle = document.getElementById("search-toggle");
      var backdrop = document.getElementById("search-backdrop");
      var modal = document.getElementById("search-modal");
      var input = document.getElementById("search-input");
      var results = document.getElementById("search-results");
      var index = null;

      function openSearch() {
        backdrop.style.display = "block";
        modal.style.display = "flex";
        input.focus();
        if (!index) {
          fetch("/search-index.json")
            .then(function (r) { return r.json(); })
            .then(function (data) { index = data; });
        }
      }

      function closeSearch() {
        backdrop.style.display = "none";
        modal.style.display = "none";
        input.value = "";
        results.innerHTML = "";
      }

      function runSearch(query) {
        if (!index || !query) {
          results.innerHTML = "";
          return;
        }
        var q = query.toLowerCase();
        var matches = index.filter(function (item) {
          return (
            item.title.toLowerCase().indexOf(q) !== -1 ||
            item.description.toLowerCase().indexOf(q) !== -1 ||
            item.tags.some(function (t) { return t.toLowerCase().indexOf(q) !== -1; })
          );
        });
        if (matches.length === 0) {
          results.innerHTML = '<div class="search-empty">No results</div>';
          return;
        }
        results.innerHTML = matches
          .map(function (item) {
            return (
              '<a class="search-result" href="' + item.url + '">' +
              '<div class="search-result-title">' + item.title + "</div>" +
              '<div class="search-result-excerpt">' + item.description + "</div>" +
              "</a>"
            );
          })
          .join("");
      }

      toggle.addEventListener("click", openSearch);
      backdrop.addEventListener("click", closeSearch);
      input.addEventListener("input", function () { runSearch(input.value); });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") closeSearch();
      });
    })();
  </script>
